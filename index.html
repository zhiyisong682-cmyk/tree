<body>
    <div class="ui">Merry Christmas</div>
    <div id="canvas-container"></div>

    <script>
        // 核心参数：保持原本的高端质感
        let scene, camera, renderer, clock, treeParticles;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // 关键：模拟 Cinema 滤镜的色彩空间
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 1. 生成原本的圣诞树粒子逻辑
            const geometry = new THREE.BufferGeometry();
            const count = 15000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const t = i / count;
                const angle = t * Math.PI * 30; // 螺旋角度
                const radius = 5 * (1 - t);   // 锥形
                
                // 核心：保持原本的数学分布，不做乱改
                const x = Math.cos(angle) * radius + (Math.random() - 0.5) * 0.5;
                const y = t * 14 - 7;
                const z = Math.sin(angle) * radius + (Math.random() - 0.5) * 0.5;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // 还原原本的色值配色
                const color = new THREE.Color();
                color.setHSL(0.3 + t * 0.1, 0.7, 0.2 + t * 0.4); // 翡翠绿到金绿
                if (Math.random() > 0.95) color.setHex(0xffffff); // 随机星光点

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                sizes[i] = Math.random() * 2.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // 关键：原本代码中的 Shader 材质感
            const material = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });

            treeParticles = new THREE.Points(geometry, material);
            scene.add(treeParticles);

            // 背景虚化粒子（环境氛围）
            addEnvironment();

            animate();
        }

        function addEnvironment() {
            const envGeo = new THREE.BufferGeometry();
            const envPos = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) envPos[i] = (Math.random() - 0.5) * 40;
            envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
            const envMat = new THREE.PointsMaterial({ size: 0.02, color: 0x444444 });
            scene.add(new THREE.Points(envGeo, envMat));
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // 保持原本的旋转和飘逸感
            treeParticles.rotation.y += delta * 0.15;
            
            // 简单的电影感镜头运镜
            camera.position.x = Math.sin(elapsed * 0.3) * 1.5;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
